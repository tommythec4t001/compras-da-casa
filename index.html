<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compras da Casa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compras">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e6e7e3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: app de uma coluna para celular, duas abas (Compra / Promoções), cartões com letra grande */
  --bg: #e6e7e3;
  --card: #f1f2ee;
  --ink: #22261f;
  --muted: #5f665a;
  --accent: #2f6a4c;
  --accent-soft: #d3e5d9;
  --line: #cfd3c9;
  --hot: #b4472b;
  --hot-soft: #f2dcd3;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1e1a; --card: #252923; --ink: #e5e8e0; --muted: #a1a89a; --accent: #7cc49d;
    --accent-soft: #2b4135; --line: #393e36; --hot: #ee9a7e; --hot-soft: #4a2b22; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1e1a; --card: #252923; --ink: #e5e8e0; --muted: #a1a89a; --accent: #7cc49d;
  --accent-soft: #2b4135; --line: #393e36; --hot: #ee9a7e; --hot-soft: #4a2b22; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
main { max-width: 560px; margin: 0 auto; padding: max(22px, env(safe-area-inset-top)) 16px 56px; display: grid; gap: 16px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; margin: 0; line-height: 1.1; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 5px; }
.tab { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 11px 8px; background: transparent; color: var(--muted); cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--card); }
.badge { font-size: .78rem; font-variant-numeric: tabular-nums; background: var(--hot); color: var(--card); border-radius: 999px; padding: 0 8px; min-width: 22px; text-align: center; }
.panel { display: grid; gap: 14px; }
.panel[hidden] { display: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; }
.total-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.label { color: var(--muted); font-size: .9rem; }
.pill { display: inline-block; font-size: .85rem; font-weight: 700; border-radius: 999px; padding: 4px 12px; }
.pill.wait { background: var(--hot-soft); color: var(--hot); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.prev { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; margin: 0; }
ul.items { list-style: none; margin: 0; padding: 0; display: grid; }
ul.items li { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
ul.items li:first-child { border-top: 0; }
.qty { color: var(--muted); font-size: .9rem; }
.price { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; text-align: right; }
.was { display: block; font-weight: 500; font-size: .82rem; color: var(--muted); text-decoration: line-through; }
.hot { color: var(--hot); font-size: .8rem; font-weight: 700; }
ul.notes { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.btn { font: inherit; font-weight: 800; font-size: 1.05rem; border: 0; border-radius: 14px; padding: 15px 18px; cursor: pointer; background: var(--accent); color: var(--card); width: 100%; }
.btn:disabled { opacity: .55; cursor: default; }
.hint { color: var(--muted); font-size: .88rem; margin: 0; }
.promo { display: grid; gap: 6px; }
.promo-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.promo-name { font-weight: 700; }
.off { font-family: var(--font-display); font-weight: 700; color: var(--hot); font-size: 1.4rem; line-height: 1; white-space: nowrap; }
.chip { justify-self: start; font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: var(--accent-soft); color: var(--accent); }
.chip.low { background: var(--hot-soft); color: var(--hot); }
.tip { font-size: .9rem; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 26px 12px; }
.status { text-align: center; color: var(--muted); font-size: .9rem; margin: 0; }
.promo-img { width: 76px; height: 76px; flex: none; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); object-fit: contain; }
.promo-row { display: flex; gap: 14px; align-items: flex-start; }
.promo-body { flex: 1; min-width: 0; display: grid; gap: 6px; }
.foot { text-align: center; margin: 8px 0 0; }
.foot a, .linkbtn { color: var(--muted); font-size: .88rem; background: none; border: 0; font: inherit; text-decoration: underline; cursor: pointer; padding: 6px; }
#editar[hidden], .is-editing .tabs, .is-editing #compra, .is-editing #promos, .is-editing .foot { display: none !important; }
.ed-item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.ed-item > summary { padding: 14px 16px; cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.ed-item > summary::-webkit-details-marker { display: none; }
.ed-item > summary small { color: var(--muted); font-weight: 500; text-align: right; }
.ed-fields { padding: 0 16px 16px; display: grid; gap: 10px; }
.ed-fields label { display: grid; gap: 4px; font-size: .88rem; font-weight: 600; }
.ed-fields label span { color: var(--muted); font-weight: 500; }
.ed-fields input[type="text"], .ed-card input[type="password"] { width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.ed-check { display: flex !important; grid-template-columns: none !important; align-items: center; gap: 10px !important; }
.ed-check input { width: 20px; height: 20px; accent-color: var(--accent); }
.btn.ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
.btn.danger { background: transparent; color: var(--hot); border: 2px solid var(--hot); padding: 10px 14px; font-size: .95rem; }
.ed-actions { display: grid; gap: 10px; position: sticky; bottom: 0; padding: 12px 0 max(12px, env(safe-area-inset-bottom)); background: var(--bg); }
.ed-card ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: .92rem; }
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { .tab { transition: background .15s, color .15s; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Compras da Casa</h1>
    <p class="sub" id="updated">Super Muffato</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Seções">
    <button class="tab" role="tab" id="tab-compra" aria-controls="compra" aria-selected="true">Compra</button>
    <button class="tab" role="tab" id="tab-promos" aria-controls="promos" aria-selected="false">Promoções <span class="badge" id="promoCount" hidden>0</span></button>
  </div>

  <section class="panel" id="compra" role="tabpanel" aria-labelledby="tab-compra">
    <div class="card" id="compraCard">
      <p class="empty">Carregando a compra…</p>
    </div>
  </section>

  <section class="panel" id="promos" role="tabpanel" aria-labelledby="tab-promos" hidden>
    <div id="promoList" class="panel">
      <div class="card"><p class="empty">Carregando promoções…</p></div>
    </div>
  </section>

  <section class="panel" id="editar" hidden aria-label="Editar lista-base">
    <div class="total-row"><h2 style="font-size:1.4rem">Lista-base</h2><button class="linkbtn" id="edSair">Voltar ao app</button></div>
    <p class="hint">O que você mudar aqui vale para a busca de promoções a partir da próxima checagem diária.</p>
    <div id="edToken"></div>
    <div id="edLista" class="panel"></div>
    <button class="btn ghost" id="edAdd" type="button">+ Adicionar item</button>
    <div class="ed-actions">
      <button class="btn" id="edSalvar" type="button">Salvar lista</button>
      <p class="status" id="edStatus" aria-live="polite"></p>
    </div>
  </section>

  <p class="foot"><a href="#editar">Editar lista-base</a></p>
  <p class="status" id="status" aria-live="polite"></p>
</main>

<script>
(function () {
  var brl = function (n) { return typeof n === "number" ? n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }) : "—"; };
  var el = function (id) { return document.getElementById(id); };
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function fmtDate(s) {
    if (!s) return "";
    var d = new Date(s);
    if (isNaN(d)) return s;
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  // Abas
  var tabs = [el("tab-compra"), el("tab-promos")];
  function show(which) {
    tabs.forEach(function (t) {
      var on = t.getAttribute("aria-controls") === which;
      t.setAttribute("aria-selected", on ? "true" : "false");
      el(t.getAttribute("aria-controls")).hidden = !on;
    });
    if (location.hash !== "#" + which) { try { history.replaceState(null, "", "#" + which); } catch (e) {} }
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { show(t.getAttribute("aria-controls")); }); });
  function rota() {
    var h = location.hash;
    var editando = h === "#editar";
    document.body.classList.toggle("is-editing", editando);
    el("editar").hidden = !editando;
    if (editando) { abrirEditor(); window.scrollTo(0, 0); }
    else if (h === "#promos" || h === "#compra") show(h.slice(1));
  }
  window.addEventListener("hashchange", rota);

  function renderCompra(c) {
    var card = el("compraCard");
    if (!c || !c.itens) { card.innerHTML = '<p class="empty">Nenhuma compra montada ainda. Quando a lista encher, a compra aparece aqui.</p>'; return; }
    var st = c.status || "previa";
    var pill = st === "paga" ? '<span class="pill ok">Paga</span>'
      : st === "aguardando" ? '<span class="pill wait">Pronta para pagar</span>'
      : '<span class="pill prev">Prévia</span>';
    var itens = (c.itens || []).map(function (i) {
      return '<li><div>' + esc(i.nome) + (i.qtd && i.qtd !== 1 ? ' <span class="qty">× ' + esc(i.qtd) + '</span>' : '') +
        (i.promo ? ' <span class="hot">🔥 promoção</span>' : '') + '</div><div class="price">' + brl(i.subtotal) + '</div></li>';
    }).join("");
    var lista = function (titulo, arr) { return (arr || []).length ? '<div><h2>' + titulo + '</h2><ul class="notes">' + arr.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + '</ul></div>' : ""; };
    var action = st === "aguardando"
      ? (c.linkCarrinho ? '<a class="btn" style="text-align:center;text-decoration:none" href="' + esc(c.linkCarrinho) + '" target="_blank" rel="noopener">Colocar tudo no carrinho do Muffato</a>' : '') +
        '<p class="hint">O botão abre o site do Muffato com a compra inteira no carrinho. Se pedir, entre na sua conta. Depois é só conferir, escolher entrega ou retirada e pagar.</p>'
      : st === "paga" ? '<p class="hint">Compra paga. A próxima aparece aqui quando a lista encher.</p>'
      : '<p class="hint">Prévia com os preços de hoje.</p>';
    var frete = typeof c.frete === "number" ? (c.frete > 0 ? " + frete de " + brl(c.frete) : " (frete grátis)") : " + frete";
    card.innerHTML =
      '<div class="total-row"><div><div class="label">Total' + esc(frete) + '</div><div class="big">' + brl(c.total) + '</div></div>' + pill + '</div>' +
      (c.criadaEm ? '<p class="hint">Montada em ' + esc(fmtDate(c.criadaEm)) + (c.economia ? ' · economia com promoções: ' + brl(c.economia) : '') + '</p>' : '') +
      '<div><h2>No carrinho</h2><ul class="items">' + itens + '</ul></div>' + lista("Trocas que eu fiz", c.trocas) + lista("Ficou de fora", c.foraDaCompra) + action;
  }

  function renderPromos(p) {
    var list = el("promoList"), badge = el("promoCount");
    var itens = (p && p.itens) || [];
    badge.textContent = itens.length; badge.hidden = itens.length === 0;
    if (p && p.atualizadoEm) el("updated").textContent = "Super Muffato · promoções de " + fmtDate(p.atualizadoEm);
    if (!itens.length) { list.innerHTML = '<div class="card"><p class="empty">Nenhuma promoção interessante agora. Quando aparecer algo da sua lista, ou bem abaixo do preço normal, aparece aqui.</p></div>'; return; }
    list.innerHTML = itens.map(function (i) {
      var chip = i.motivo === "abaixo_normal" ? '<span class="chip low">Bem abaixo do preço normal</span>' : '<span class="chip">Da sua lista: ' + esc(i.item || "") + '</span>';
      var img = i.imagem ? '<img class="promo-img" src="' + esc(i.imagem) + '" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'promo-img\'}))">' : '<div class="promo-img" aria-hidden="true"></div>';
      return '<div class="card promo"><div class="promo-row">' + img + '<div class="promo-body"><div class="promo-top"><div class="promo-name">' + esc(i.nome) + '</div>' +
        (i.desconto ? '<div class="off">-' + esc(i.desconto) + '%</div>' : '<div class="off">🔥</div>') + '</div>' + chip +
        '<div class="price" style="text-align:left">' + brl(i.preco) + (i.precoDe ? ' <span class="was" style="display:inline">' + brl(i.precoDe) + '</span>' : '') + '</div>' +
        (i.condicao ? '<div class="tip"><b>' + esc(i.condicao) + '</b></div>' : '') +
        (i.dica ? '<div class="tip">💡 ' + esc(i.dica) + '</div>' : '') + '</div></div></div>';
    }).join("");
  }

  function carregar(arquivo) {
    return fetch("data/" + arquivo + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  function atualizar() {
    el("status").textContent = "";
    carregar("compra.json").then(renderCompra).catch(function () { el("compraCard").innerHTML = '<p class="empty">Não consegui carregar a compra. Confira a internet e tente de novo.</p>'; });
    carregar("promocoes.json").then(renderPromos).catch(function () { el("promoList").innerHTML = '<div class="card"><p class="empty">Não consegui carregar as promoções. Confira a internet e tente de novo.</p></div>'; });
  }


  // ---------- Editor da lista-base (só para quem tiver o token do GitHub) ----------
  var REPO = "tommythec4t001/compras-da-casa", ARQ = "data/config.json", CHAVE = "cc-github-token";
  var cfg = null, editorAberto = false;
  function lerToken() { try { return localStorage.getItem(CHAVE) || ""; } catch (e) { return ""; } }
  function gravarToken(t) { try { if (t) localStorage.setItem(CHAVE, t); else localStorage.removeItem(CHAVE); return true; } catch (e) { return false; } }
  var lista2txt = function (a) { return (a || []).join(", "); };
  var txt2lista = function (t) { return String(t || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean); };

  function renderToken() {
    var box = el("edToken");
    if (lerToken()) {
      box.innerHTML = '<p class="hint">Este aparelho pode salvar alterações. <button class="linkbtn" id="edEsquecer" type="button">Remover acesso deste aparelho</button></p>';
      el("edEsquecer").onclick = function () { gravarToken(""); renderToken(); };
      return;
    }
    box.innerHTML = '<div class="card ed-card"><h2>Liberar edição neste aparelho</h2>' +
      '<p class="hint">Faça isso uma vez, só no seu celular ou computador. Sem isso, dá para ver a lista, mas não salvar.</p>' +
      '<ol><li>No GitHub: Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.</li>' +
      '<li>Em "Repository access", escolha só <b>compras-da-casa</b>.</li>' +
      '<li>Em "Permissions", ponha <b>Contents</b> como <b>Read and write</b>.</li>' +
      '<li>Gere, copie o código e cole aqui.</li></ol>' +
      '<input type="password" id="edTokenInput" placeholder="github_pat_…" autocomplete="off">' +
      '<button class="btn" id="edTokenSalvar" type="button">Liberar edição</button></div>';
    el("edTokenSalvar").onclick = function () {
      var t = el("edTokenInput").value.trim();
      if (!t) return;
      if (!gravarToken(t)) { el("edStatus").textContent = "Este navegador não deixou guardar o acesso."; return; }
      renderToken();
    };
  }

  function campo(i, chave, rotulo, dica, valor) {
    return '<label>' + rotulo + (dica ? ' <span>' + dica + '</span>' : '') +
      '<input type="text" data-i="' + i + '" data-k="' + chave + '" id="ed-' + chave + '-' + i + '" value="' + esc(valor) + '"></label>';
  }

  function renderLista(abrir) {
    var box = el("edLista");
    box.innerHTML = cfg.itens.map(function (it, i) {
      return '<details class="ed-item"' + (abrir === i ? " open" : "") + '><summary>' + esc(it.nome || "Novo item") + '<small>' + esc(it.quantidade || "") + '</small></summary><div class="ed-fields">' +
        campo(i, "nome", "Item", "", it.nome) +
        campo(i, "quantidade", "Quantidade e frequência", "ex.: 2 pacotes de 1 kg, mensal", it.quantidade) +
        campo(i, "busca", "Pesquisar no Muffato por", "", it.busca) +
        campo(i, "precisaTer", "O nome precisa ter", "separe por vírgula", lista2txt(it.precisaTer)) +
        campo(i, "naoPodeTer", "Não pode ter", "separe por vírgula", lista2txt(it.naoPodeTer)) +
        campo(i, "marcas", "Marcas aceitas", "vazio = qualquer marca", lista2txt(it.marcas)) +
        '<label class="ed-check"><input type="checkbox" data-i="' + i + '" data-k="estocavel" id="ed-estocavel-' + i + '"' + (it.estocavel ? " checked" : "") + '> Não estraga (pode estocar)</label>' +
        campo(i, "skus", "Código do produto escolhido", "opcional, eu preencho", lista2txt(it.skus)) +
        '<button class="btn danger" type="button" data-remover="' + i + '">Remover item</button>' +
        '</div></details>';
    }).join("");
  }

  function lerCampos() {
    Array.prototype.forEach.call(el("edLista").querySelectorAll("[data-k]"), function (inp) {
      var it = cfg.itens[+inp.dataset.i], k = inp.dataset.k;
      if (!it) return;
      if (k === "estocavel") it[k] = inp.checked;
      else if (["precisaTer", "naoPodeTer", "marcas", "skus"].indexOf(k) >= 0) it[k] = txt2lista(inp.value).map(function (w) { return k === "skus" ? w : w.toLowerCase(); });
      else it[k] = inp.value.trim();
    });
  }

  el("edLista").addEventListener("click", function (e) {
    var b = e.target.closest("[data-remover]");
    if (!b) return;
    if (b.dataset.confirmar !== "1") { b.dataset.confirmar = "1"; b.textContent = "Toque de novo para remover"; return; }
    lerCampos();
    cfg.itens.splice(+b.dataset.remover, 1);
    renderLista();
    el("edStatus").textContent = "Item removido. Toque em “Salvar lista” para confirmar.";
  });
  el("edLista").addEventListener("input", function (e) {
    if (e.target.dataset.k === "nome") { var s = e.target.closest("details").querySelector("summary"); s.firstChild.textContent = e.target.value || "Novo item"; }
  });
  el("edAdd").onclick = function () {
    lerCampos();
    cfg.itens.push({ nome: "", quantidade: "", busca: "", precisaTer: [], naoPodeTer: [], marcas: [], estocavel: false, skus: [] });
    renderLista(cfg.itens.length - 1);
    var f = el("ed-nome-" + (cfg.itens.length - 1)); if (f) f.focus();
  };
  el("edSair").onclick = function () { location.hash = "#compra"; };

  function paraBase64(t) { return btoa(unescape(encodeURIComponent(t))); }

  el("edSalvar").onclick = async function () {
    var st = el("edStatus"), token = lerToken();
    if (!cfg) return;
    if (!token) { st.textContent = "Libere a edição neste aparelho primeiro (quadro acima)."; return; }
    lerCampos();
    cfg.itens.forEach(function (it) { if (!it.busca) it.busca = it.nome; });
    var vazios = cfg.itens.filter(function (it) { return !it.nome; });
    if (vazios.length) { st.textContent = "Tem item sem nome. Preencha ou remova antes de salvar."; return; }
    var b = el("edSalvar"); b.disabled = true; b.textContent = "Salvando…"; st.textContent = "";
    var api = "https://api.github.com/repos/" + REPO + "/contents/" + ARQ;
    var cab = { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" };
    try {
      var atual = await fetch(api + "?ref=main&t=" + Date.now(), { headers: cab, cache: "no-store" });
      if (atual.status === 401 || atual.status === 403) throw new Error("token");
      if (!atual.ok) throw new Error("HTTP " + atual.status);
      var sha = (await atual.json()).sha;
      var r = await fetch(api, { method: "PUT", headers: cab, body: JSON.stringify({ message: "Lista-base atualizada pelo app", content: paraBase64(JSON.stringify(cfg, null, 2) + "\n"), sha: sha, branch: "main" }) });
      if (r.status === 401 || r.status === 403) throw new Error("token");
      if (!r.ok) throw new Error("HTTP " + r.status);
      st.textContent = "Lista salva. Vale a partir da próxima checagem de promoções.";
      renderLista();
    } catch (err) {
      st.textContent = err.message === "token"
        ? "O GitHub recusou o acesso. Confira se o token tem Contents com Read and write no compras-da-casa."
        : "Não consegui salvar (" + err.message + "). Confira a internet e tente de novo.";
    }
    b.disabled = false; b.textContent = "Salvar lista";
  };

  function abrirEditor() {
    renderToken();
    if (editorAberto && cfg) return;
    el("edLista").innerHTML = '<div class="card"><p class="empty">Carregando a lista…</p></div>';
    carregar("config.json").then(function (c) { cfg = c; cfg.itens = cfg.itens || []; editorAberto = true; renderLista(); })
      .catch(function () { el("edLista").innerHTML = '<div class="card"><p class="empty">Não consegui carregar a lista. Confira a internet.</p></div>'; });
  }

  rota();

  atualizar();
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") atualizar(); });
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
})();
</script>
</body>
</html>
