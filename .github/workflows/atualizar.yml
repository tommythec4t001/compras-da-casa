name: Atualizar promoções e compra

on:
  schedule:
    # A cada 30 min, das 7h às 22h30 em Londrina (UTC-3).
    # Promoções: uma vez por dia (primeira rodada). Compra: toda rodada.
    - cron: "7,37 10-23 * * *"
    - cron: "7,37 0-1 * * *"
  workflow_dispatch:
    inputs:
      aviso_teste:
        description: "Mandar um aviso de teste para os celulares"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir promoções e montar a compra
        env:
          FORCAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/atualizar.mjs
      - name: Mandar avisos para o celular
        continue-on-error: true
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          TESTE: ${{ inputs.aviso_teste && '1' || '0' }}
        run: |
          npm install --no-save --no-package-lock --silent web-push@3.6.7
          node scripts/avisar.mjs
      - name: Salvar dados
        run: |
          git config user.name "compras-da-casa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Atualização de $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase origin main
          git push
